<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jing Twins</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="index-page">
  <div class="container">
    <div class="index-layout">
      <div class="index-content">
        <h1 id="titleName"><a href="/albert" class="name-link">Albert</a> & <a href="/geoffrey" class="name-link">Geoffrey</a> Jing</h1>
        <p class="intro">
          identical twins.<br />
          building and learning.<br />
          <!-- current fascinations: mechanics of agency, SMBs unit economics, computer-use & voice AI, post-impressionalism art & design, and discipline of restraint. -->
        </p>
      </div>

      <div class="index-photo">
        <div class="photo-stack" id="photoStack">
          <img src="images/jingtwins1.JPG" alt="Albert & Geoffrey Jing" class="photo-layer is-active" data-index="0" />
          <img src="images/jingtwins2.JPG" alt="" class="photo-layer" data-index="1" aria-hidden="true" />
          <img src="images/jingtwins5.jpg" alt="" class="photo-layer" data-index="2" aria-hidden="true" />
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>&copy; Jing Twins <span id="currentYear"></span></p>
    </footer>
  </div>

  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();

    var stack = document.getElementById("photoStack");
    var layers = stack.querySelectorAll(".photo-layer");
    var current = 0;
    var total = layers.length;

    layers.forEach(function (layer, i) {
      if (i > 0) {
        var img = new Image();
        img.src = layer.getAttribute("src");
      }
    });

    function show(index) {
      current = index;
      stack.dataset.active = index;
      layers.forEach(function (layer, i) {
        layer.classList.toggle("is-active", i === index);
        layer.setAttribute("aria-hidden", i !== index);
      });
    }

    stack.addEventListener("mouseenter", function () {
      stack.classList.add("is-hovered");
      show((current + 1) % total);
    });

    stack.addEventListener("mouseleave", function () {
      stack.classList.remove("is-hovered");
    });
  </script>

  <script>
    function wrapCharsInNode(node) {
      var nodes = Array.from(node.childNodes);
      nodes.forEach(function (child) {
        if (child.nodeType === 3) {
          var text = child.textContent;
          var frag = document.createDocumentFragment();
          text.split("").forEach(function (c) {
            var s = document.createElement("span");
            s.className = "char";
            s.textContent = c === " " ? "\u00A0" : c;
            frag.appendChild(s);
          });
          node.replaceChild(frag, child);
        } else if (child.nodeType === 1) {
          wrapCharsInNode(child);
        }
      });
    }

    var titleEl = document.getElementById("titleName");
    wrapCharsInNode(titleEl);

    var chars = titleEl.querySelectorAll(".char");
    var magneticRAF = null;
    var mouseX = 0, mouseY = 0;

    document.addEventListener("mousemove", function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!magneticRAF) {
        magneticRAF = requestAnimationFrame(updateMagnetic);
      }
    });

    function updateMagnetic() {
      magneticRAF = null;
      for (var i = 0; i < chars.length; i++) {
        var ch = chars[i];
        var rect = ch.getBoundingClientRect();
        var chX = rect.left + rect.width / 2;
        var chY = rect.top + rect.height / 2;
        var distX = mouseX - chX;
        var distY = mouseY - chY;
        var dist = Math.sqrt(distX * distX + distY * distY);
        if (dist < 200) {
          var strength = (1 - dist / 200) * 8;
          ch.style.transform = "translate(" + (distX / dist) * strength + "px, " + (distY / dist) * strength + "px)";
        } else if (ch.style.transform) {
          ch.style.transform = "";
        }
      }
    }
  </script>
  <script src="cursor.js"></script>
</body>
</html>
